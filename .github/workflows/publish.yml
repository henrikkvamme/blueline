# Publishes the package to npm when a version tag is pushed, as `v0.1.4` for 0.1.4.
#
# npm trusts this workflow by OIDC (trusted publishing), so it holds no token and needs no
# security key: the package's npm settings name henrikkvamme/blueline and this file. The
# tag must match package.json's version.
#
# Run `pnpm run verify` locally before you push the tag. Its timed browser tests and its
# dev-server process tests assume a faster machine than a hosted runner, so this workflow
# runs only the checks that do not depend on speed, and builds the package it publishes.

name: Publish

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # The OIDC token npm trusts in place of a token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Check the tag names the package's version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$version" ]; then
            echo "The tag $TAG does not match package.json's $version" >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - run: pnpm run check

      - run: pnpm run pack

      - run: pnpm publish --access public --no-git-checks --provenance
